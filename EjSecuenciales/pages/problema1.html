<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área del Triángulo</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="nav-brand"><div class="nav-brand-icon">🐢</div><span class="nav-brand-text">TurtleLand</span></a>
    <a href="../index.html" class="nav-back">← Inicio</a>
  </nav>
<main>
  <div class="problem-layout">
    <div class="problem-visual-panel">
      <div class="problem-emoji-wrap">
      <div class="problem-emoji-bg">
        <img src="https://i.pinimg.com/736x/59/a0/a8/59a0a8e99aca40ed46d2c1b55cae569d.jpg" alt="triangulito" class="problem-image">
      </div>
      </div>
      <div class="problem-info">
        <div class="problem-num-badge">Ejercicio 2.1</div>
        <div class="problem-visual-title">Área del Triángulo</div>
      </div>
      <div class="formula-card">A = (base x altura) / 2</div>
    </div>
    <div class="problem-form-panel">
      <div class="problem-header">
        <h1>Área del Triángulo</h1>
        <p>Ingresa la base y la altura del triángulo para calcular su área.</p>
      </div>
      <div>
        <div class="form-group"><label class="form-label">Base</label><input class="form-input" id="base" type="number" placeholder="ej. 10"></div>
        <div class="form-group"><label class="form-label">Altura</label><input class="form-input" id="altura" type="number" placeholder="ej. 5"></div>
        <div id="result" class="result-card">
          <div class="result-label">Área del triángulo</div>
          <div class="result-value" id="result-value">—</div>
          <div class="result-desc" id="result-desc"></div>
        </div>
        <div style="margin-top:24px">
          <button class="btn-primary" onclick="calcular()"><span>✦</span> Calcular</button>
          <button class="btn-reset" onclick="resetForm()">Limpiar campos</button>
        </div>
      </div>
    </div>
  </div>
</main>
  <script src="../js/problema1.js"></script>
</body>
</html>
