<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Descuento e IVA</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="nav-brand"><div class="nav-brand-icon">🐢</div><span class="nav-brand-text">TurtleLand</span></a>
    <a href="../index.html" class="nav-back">← Inicio</a>
  </nav>
<main>
  <div class="problem-layout">
    <div class="problem-visual-panel">
      <div class="problem-emoji-wrap">
        <div class="problem-emoji-bg">
          <img src="https://img.freepik.com/vector-premium/mujer-feliz-comprando-bolsas-sonriendo_123891-144261.jpg" alt="chica haciendo compras" class="problem-image">
        </div>
      </div>
      <div class="problem-info"><div class="problem-num-badge">Ejercicio 2.12</div><div class="problem-visual-title">Precio con Descuento e IVA</div></div>
      <div class="formula-card">desc = precio × 0.20<br>con_iva = (precio − desc) × 1.15</div>
    </div>
    <div class="problem-form-panel">
      <div class="problem-header"><h1>Precio Final con Descuento e IVA</h1><p>Aplica un descuento del 20% y luego agrega el IVA del 15% para obtener el precio final.</p></div>
      <div>
        <div class="form-group"><label class="form-label">Precio original ($)</label><input class="form-input" id="precio" type="number" placeholder="ej. 500.00" min="0" step="0.01"/></div>
        <div id="result" class="result-card"><div class="result-label">Precio final a pagar</div><div class="result-value" id="result-value">—</div><div class="result-desc" id="result-desc"></div></div>
        <div style="margin-top:24px"><button class="btn-primary" onclick="calcular()"><span>✦</span> Calcular</button><button class="btn-reset" onclick="resetForm()">Limpiar campos</button></div>
      </div>
    </div>
  </div>
</main>
  <script src="../js/problema12.js"></script>
</body>
</html>
