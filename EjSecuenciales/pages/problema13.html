<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ahorro</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="nav-brand"><div class="nav-brand-icon">🐢</div><span class="nav-brand-text">TurtleLand</span></a>
    <a href="../index.html" class="nav-back">← Inicio</a>
  </nav>
<main>
  <div class="problem-layout">
    <div class="problem-visual-panel">
      <div class="problem-emoji-wrap">
        <div class="problem-emoji-bg">
          <img src="https://static.vecteezy.com/system/resources/previews/005/374/404/original/illustration-graphic-cartoon-character-of-money-saving-free-vector.jpg" alt="persona ahorrando" class="problem-image">
        </div>
      </div>
      <div class="problem-info"><div class="problem-num-badge">Ejercicio 2.13</div><div class="problem-visual-title">Ahorro Anual</div></div>
      <div class="formula-card">ahorro_sem = sueldo x 0.15<br>ahorro_anual = ahorro_sem x 52</div>
    </div>
    <div class="problem-form-panel">
      <div class="problem-header"><h1>Ahorro Anual</h1><p>Guarda el 15% de tu sueldo semanal durante todo un año (52 semanas).</p></div>
      <div>
        <div class="form-group"><label class="form-label">Sueldo semanal ($)</label><input class="form-input" id="sueldo" type="number" placeholder="ej. 2500.00" min="0" step="0.01"/></div>
        <div id="result" class="result-card"><div class="result-label">Ahorro total en un año</div><div class="result-value" id="result-value">—</div><div class="result-desc" id="result-desc"></div></div>
        <div style="margin-top:24px"><button class="btn-primary" onclick="calcular()"><span>✦</span> Calcular</button><button class="btn-reset" onclick="resetForm()">Limpiar campos</button></div>
      </div>
    </div>
  </div>
</main>
  <script src="../js/problema13.js"></script>
</body>
</html>
