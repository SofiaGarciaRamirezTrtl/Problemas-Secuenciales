<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiempo Vivido</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="nav-brand"><div class="nav-brand-icon">🐢</div><span class="nav-brand-text">TurtleLand</span></a>
    <a href="../index.html" class="nav-back">← Inicio</a>
  </nav>
  <main><div class="problem-layout">
    <div class="problem-visual-panel">
      <div class="problem-emoji-wrap">
        <div class="problem-emoji-bg">
          <img src="https://img.freepik.com/premium-vector/a-cute-clock-logo-vector-illustration-flat-designcute-smiling-happy-alarm-time-clockclock-illustra_734654-696.jpg?w=2000" alt="reloj con orejas de gato" class="problem-image">
        </div>
      </div>
      <div class="problem-info"><div class="problem-num-badge">Ejercicio 2.18</div><div class="problem-visual-title">Tiempo Vivido</div></div>
      <div class="formula-card">meses = años x 12<br>semanas = años x 52<br>días = años x 365<br>horas = días x 24</div>
    </div>
    <div class="problem-form-panel">
      <div class="problem-header"><h1>Aproximación de Tiempo Vivido</h1><p>Ingresa tu año de nacimiento para calcular cuántos meses, semanas, días y horas has vivido (aprox.).</p></div>
      <div>
        <div class="form-group"><label class="form-label">Año de nacimiento</label><input class="form-input" id="anio" type="number" placeholder="ej. 2000" min="1900" max="2025"/></div>
        <div id="result" class="result-card"><div class="result-label">Has vivido aproximadamente...</div><div class="result-value" id="result-value">—</div><div class="result-desc" id="result-desc"></div></div>
        <div style="margin-top:24px"><button class="btn-primary" onclick="calcular()"><span>✦</span> Calcular</button><button class="btn-reset" onclick="resetForm()">Limpiar campos</button></div>
      </div>
    </div>
  </div>
</main>
  <script src="../js/problema18.js"></script>
</body>
</html>
