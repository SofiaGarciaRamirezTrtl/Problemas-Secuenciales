<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calcular Edad</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="nav-brand"><div class="nav-brand-icon">🐢</div><span class="nav-brand-text">TurtleLand</span></a>
    <a href="../index.html" class="nav-back">← Inicio</a>
  </nav>
<main>
  <div class="problem-layout">
    <div class="problem-visual-panel">
      <div class="problem-emoji-wrap">
        <div class="problem-emoji-bg">
        <img src="https://static.vecteezy.com/system/resources/previews/023/374/489/original/cute-kawaii-cake-chibi-mascot-cartoon-style-vector.jpg" alt="pastel" class="problem-image">
        </div>
      </div>
      <div class="problem-info">
        <div class="problem-num-badge">Ejercicio 2.3</div>
        <div class="problem-visual-title">Calcular Edad</div>
      </div>
      <div class="formula-card">edad = año_actual − año_nacimiento</div>
    </div>
    <div class="problem-form-panel">
      <div class="problem-header">
        <h1>Calcular Edad</h1>
        <p>Ingrese el año de nacimiento para calcular la edad aproximada.</p>
      </div>
      <div>
        <div class="form-group"><label class="form-label">Año de nacimiento</label><input class="form-input" id="anio" type="number" placeholder="ej. 2000" min="1900" max="2025" />
        </div>
        <div id="result" class="result-card">
          <div class="result-label">Edad aproximada</div>
          <div class="result-value" id="result-value">—</div>
          <div class="result-desc" id="result-desc"></div>
        </div>
        <div style="margin-top:24px">
          <button class="btn-primary" onclick="calcular()"><span>✦</span> Calcular</button>
          <button class="btn-reset" onclick="resetForm()">Limpiar campos</button>
        </div>
      </div>
    </div>
  </div>
</main>
  <script src="../js/problema3.js"></script>
</body>
</html>
