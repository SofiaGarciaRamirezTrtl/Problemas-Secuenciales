<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estacionamiento</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="nav-brand"><div class="nav-brand-icon">🐢</div><span class="nav-brand-text">TurtleLand</span></a>
    <a href="../index.html" class="nav-back">← Inicio</a>
  </nav>
<main>
  <div class="problem-layout">
    <div class="problem-visual-panel">
      <div class="problem-emoji-wrap">
        <div class="problem-emoji-bg">
          <img src="https://img.freepik.com/premium-photo/cute-cartoon-car-vector-illustration-isolated-white-background_856795-36742.jpg?w=2000" alt="carro" class="problem-image">
        </div>
      </div>
      <div class="problem-info"><div class="problem-num-badge">Ejercicio 2.4</div><div class="problem-visual-title">Cobro de Estacionamiento</div></div>
      <div class="formula-card">costo = horas x tarifa_por_hora</div>
    </div>
    <div class="problem-form-panel">
      <div class="problem-header"><h1>Cobro de Estacionamiento</h1><p>Calcula el costo total según las horas de uso y la tarifa aplicada.</p></div>
      <div>
        <div class="form-group"><label class="form-label">Horas utilizadas</label><input class="form-input" id="horas" type="number" placeholder="ej. 3" min="0" step="0.5"/></div>
        <div class="form-group"><label class="form-label">Tarifa por hora ($)</label><input class="form-input" id="tarifa" type="number" placeholder="ej. 15.00" min="0" step="0.01"/></div>
        <div id="result" class="result-card"><div class="result-label">Total a pagar</div><div class="result-value" id="result-value">—</div><div class="result-desc" id="result-desc"></div></div>
        <div style="margin-top:24px"><button class="btn-primary" onclick="calcular()"><span>✦</span> Calcular</button><button class="btn-reset" onclick="resetForm()">Limpiar campos</button></div>
      </div>
    </div>
  </div>
</main>
  <script src="../js/problema4.js"></script>
</body>
</html>
