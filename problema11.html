<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Energía Eléctrica</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="nav-brand"><div class="nav-brand-icon">🐢</div><span class="nav-brand-text">TurtleLand</span></a>
    <a href="../index.html" class="nav-back">← Inicio</a>
  </nav>
<main>
  <div class="problem-layout">
    <div class="problem-visual-panel">
      <div class="problem-emoji-wrap"><div class="problem-emoji-bg">
          <img src="https://img.freepik.com/premium-vector/cute-lightning-thunder-cartoon-vector-icon-illustration-object-nature-icon-isolated-flat-vector_1241144-199.jpg?w=740" alt="rayo" class="problem-image">
        </div>
      </div>
      <div class="problem-info"><div class="problem-num-badge">Ejercicio 2.11</div><div class="problem-visual-title">Pago de Energía Eléctrica</div></div>
      <div class="formula-card">pago = kWh x tarifa_por_kWh</div>
    </div>
    <div class="problem-form-panel">
      <div class="problem-header"><h1>Pago de Energía Eléctrica</h1><p>Calcula el costo según los kilowatts-hora consumidos y la tarifa aplicada.</p></div>
      <div>
        <div class="form-group"><label class="form-label">Kilowatts-hora consumidos (kWh)</label><input class="form-input" id="kwh" type="number" placeholder="ej. 150" min="0" step="0.1"/></div>
        <div class="form-group"><label class="form-label">Tarifa por kWh ($)</label><input class="form-input" id="tarifa" type="number" placeholder="ej. 1.10" min="0" step="0.001"/></div>
        <div id="result" class="result-card"><div class="result-label">Total a pagar</div><div class="result-value" id="result-value">—</div><div class="result-desc" id="result-desc"></div></div>
        <div style="margin-top:24px"><button class="btn-primary" onclick="calcular()"><span>✦</span> Calcular</button><button class="btn-reset" onclick="resetForm()">Limpiar campos</button></div>
      </div>
    </div>
  </div>
</main>
  <script src="../js/problema11.js"></script>
</body>
</html>
