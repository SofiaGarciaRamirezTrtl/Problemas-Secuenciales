<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Potencia Eléctrica</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="nav-brand"><div class="nav-brand-icon">🐢</div><span class="nav-brand-text">TurtleLand</span></a>
    <a href="../index.html" class="nav-back">← Inicio</a>
  </nav>
<main>
  <div class="problem-layout">
    <div class="problem-visual-panel">
      <div class="problem-emoji-wrap">
        <div class="problem-emoji-bg">
          <img src="https://img.freepik.com/premium-vector/vector-cute-electricity-cartoon-style_846317-1613.jpg?w=2000" alt="electricidad" class="problem-image">
        </div>
      </div>
      <div class="problem-info"><div class="problem-num-badge">Ejercicio 2.15</div><div class="problem-visual-title">Potencia Eléctrica</div></div>
      <div class="formula-card">V = R x I<br>P = V x I</div>
    </div>
    <div class="problem-form-panel">
      <div class="problem-header"><h1>Potencia Eléctrica</h1><p>Calcula el voltaje y la potencia eléctrica a partir de la resistencia y la corriente.</p></div>
      <div>
        <div class="form-group"><label class="form-label">Resistencia R (Ohms Ω)</label><input class="form-input" id="R" type="number" placeholder="ej. 10" min="0" step="0.01"/></div>
        <div class="form-group"><label class="form-label">Corriente I (Amperes A)</label><input class="form-input" id="I" type="number" placeholder="ej. 2" min="0" step="0.01"/></div>
        <div id="result" class="result-card"><div class="result-label">Resultados</div><div class="result-value" id="result-value">—</div><div class="result-desc" id="result-desc"></div></div>
        <div style="margin-top:24px"><button class="btn-primary" onclick="calcular()"><span>✦</span> Calcular</button><button class="btn-reset" onclick="resetForm()">Limpiar campos</button></div>
      </div>
    </div>
  </div>
</main>
  <script src="../js/problema15.js"></script>
</body>
</html>
