<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estancia Hotel</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="nav-brand"><div class="nav-brand-icon">🐢</div><span class="nav-brand-text">TurtleLand</span></a>
    <a href="../index.html" class="nav-back">← Inicio</a>
  </nav>
<main>
  <div class="problem-layout">
    <div class="problem-visual-panel">
      <div class="problem-emoji-wrap">
        <div class="problem-emoji-bg">
          <img src="https://tse2.mm.bing.net/th/id/OIP.GDi9ZVYLzK-cGjlHVNvcgQAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="hotel" class="problem-image">
        </div>
      </div>
      <div class="problem-info"><div class="problem-num-badge">Ejercicio 2.20</div><div class="problem-visual-title">Cobro de Hotel</div></div>
      <div class="formula-card">total = noches x tarifa_por_noche</div>
    </div>
    <div class="problem-form-panel">
      <div class="problem-header"><h1>Cobro de Hotel por Estancia</h1><p>Calcula el monto total a pagar según el número de noches y la tarifa por noche.</p></div>
      <div>
        <div class="form-group"><label class="form-label">Número de noches</label><input class="form-input" id="noches" type="number" placeholder="ej. 3" min="1" step="1"/></div>
        <div class="form-group"><label class="form-label">Tarifa por noche ($)</label><input class="form-input" id="tarifa" type="number" placeholder="ej. 1200.00" min="0" step="0.01"/></div>
        <div id="result" class="result-card"><div class="result-label">Total de la estancia</div><div class="result-value" id="result-value">—</div><div class="result-desc" id="result-desc"></div></div>
        <div style="margin-top:24px"><button class="btn-primary" onclick="calcular()"><span>✦</span> Calcular</button><button class="btn-reset" onclick="resetForm()">Limpiar campos</button></div>
      </div>
    </div>
  </div>
</main>
  <script src="../js/problema20.js"></script>
</body>
</html>
