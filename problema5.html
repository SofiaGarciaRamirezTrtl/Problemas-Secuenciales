<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Presupuesto de Pintura</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="nav-brand"><div class="nav-brand-icon">🐢</div><span class="nav-brand-text">TurtleLand</span></a>
    <a href="../index.html" class="nav-back">← Inicio</a>
  </nav>
<main>
  <div class="problem-layout">
    <div class="problem-visual-panel">
      <div class="problem-emoji-wrap">
        <div class="problem-emoji-bg">
          <img src="https://static.vecteezy.com/system/resources/previews/013/369/255/original/illustration-of-paint-brush-icon-flat-cartoon-style-on-a-white-background-free-vector.jpg" alt="pincel" class="problem-image">
        </div>
      </div>
      <div class="problem-info"><div class="problem-num-badge">Ejercicio 2.5</div><div class="problem-visual-title">Presupuesto de Pintura</div></div>
      <div class="formula-card">costo = metros² x precio_por_m²</div>
    </div>
    <div class="problem-form-panel">
      <div class="problem-header"><h1>Presupuesto de Pintura</h1><p>Calcula el costo total de pintar una superficie según su área y el precio por metro cuadrado.</p></div>
      <div>
        <div class="form-group"><label class="form-label">Área a pintar (m²)</label><input class="form-input" id="area" type="number" placeholder="ej. 25" min="0" step="0.1"/></div>
        <div class="form-group"><label class="form-label">Precio por m² ($)</label><input class="form-input" id="precio" type="number" placeholder="ej. 80.00" min="0" step="0.01"/></div>
        <div id="result" class="result-card"><div class="result-label">Costo total de pintura</div><div class="result-value" id="result-value">—</div><div class="result-desc" id="result-desc"></div></div>
        <div style="margin-top:24px"><button class="btn-primary" onclick="calcular()"><span>✦</span> Calcular</button><button class="btn-reset" onclick="resetForm()">Limpiar campos</button></div>
      </div>
    </div>
  </div>
</main>
  <script src="../js/problema5.js"></script>
</body>
</html>
