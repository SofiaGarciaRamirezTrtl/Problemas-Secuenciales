<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hipotenusa</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="nav-brand"><div class="nav-brand-icon">🐢</div><span class="nav-brand-text">TurtleLand</span></a>
    <a href="../index.html" class="nav-back">← Inicio</a>
  </nav>
<main>
  <div class="problem-layout">
    <div class="problem-visual-panel">
      <div class="problem-emoji-wrap">
        <div class="problem-emoji-bg">
          <img src="https://i.pinimg.com/originals/fa/9a/a3/fa9aa3204b2751e4ef9f3cfcec6e4753.jpg" alt="hipotenusa" class="problem-image">
        </div>
      </div>
      <div class="problem-info"><div class="problem-num-badge">Ejercicio 2.6</div><div class="problem-visual-title">Hipotenusa</div></div>
      <div class="formula-card">c = √(a² + b²)</div>
    </div>
    <div class="problem-form-panel">
      <div class="problem-header"><h1>Hipotenusa Teorema de Pitágoras</h1><p>Calcula la hipotenusa de un triángulo rectángulo conociendo sus dos catetos.</p></div>
      <div>
        <div class="form-group"><label class="form-label">Cateto a</label><input class="form-input" id="catA" type="number" placeholder="ej. 3" min="0" step="0.01"/></div>
        <div class="form-group"><label class="form-label">Cateto b</label><input class="form-input" id="catB" type="number" placeholder="ej. 4" min="0" step="0.01"/></div>
        <div id="result" class="result-card"><div class="result-label">Hipotenusa (c)</div><div class="result-value" id="result-value">—</div><div class="result-desc" id="result-desc"></div></div>
        <div style="margin-top:24px"><button class="btn-primary" onclick="calcular()"><span>✦</span> Calcular</button><button class="btn-reset" onclick="resetForm()">Limpiar campos</button></div>
      </div>
    </div>
  </div>
</main>
  <script src="../js/problema6.js"></script>
</body>
</html>
