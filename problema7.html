<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boleto Autobús</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="nav-brand"><div class="nav-brand-icon">🐢</div><span class="nav-brand-text">TurtleLand</span></a>
    <a href="../index.html" class="nav-back">← Inicio</a>
  </nav>
<main>
  <div class="problem-layout">
    <div class="problem-visual-panel">
      <div class="problem-emoji-wrap">
        <div class="problem-emoji-bg">
          <img src="https://static.vecteezy.com/system/resources/previews/055/606/148/large_2x/a-cute-cartoon-bus-with-eyes-and-a-smile-free-vector.jpg" alt="autobús gatito" class="problem-image">
        </div>
      </div>
      <div class="problem-info"><div class="problem-num-badge">Ejercicio 2.7</div><div class="problem-visual-title">Boleto de Autobús</div></div>
      <div class="formula-card">costo = km x tarifa_por_km</div>
    </div>
    <div class="problem-form-panel">
      <div class="problem-header"><h1>Costo de Boleto de Autobús</h1><p>Determina el precio del boleto según la distancia recorrida y la tarifa por kilómetro.</p></div>
      <div>
        <div class="form-group"><label class="form-label">Kilómetros del viaje</label><input class="form-input" id="km" type="number" placeholder="ej. 120" min="0" step="0.1"/></div>
        <div class="form-group"><label class="form-label">Tarifa por kilómetro ($)</label><input class="form-input" id="tarifa" type="number" placeholder="ej. 0.85" min="0" step="0.01"/></div>
        <div id="result" class="result-card"><div class="result-label">Costo del boleto</div><div class="result-value" id="result-value">—</div><div class="result-desc" id="result-desc"></div></div>
        <div style="margin-top:24px"><button class="btn-primary" onclick="calcular()"><span>✦</span> Calcular</button><button class="btn-reset" onclick="resetForm()">Limpiar campos</button></div>
      </div>
    </div>
  </div>
</main>
  <script src="../js/problema7.js"></script>
</body>
</html>
