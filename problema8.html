<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viaje en Bici</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="nav-brand"><div class="nav-brand-icon">🐢</div><span class="nav-brand-text">TurtleLand</span></a>
    <a href="../index.html" class="nav-back">← Inicio</a>
  </nav>
<main>
  <div class="problem-layout">
    <div class="problem-visual-panel">
      <div class="problem-emoji-wrap">
        <div class="problem-emoji-bg">
          <img src="https://static.vecteezy.com/system/resources/previews/045/654/192/original/cute-little-girl-riding-bicycle-cartoon-character-illustration-free-vector.jpg" alt="niña en bici" class="problem-image">
        </div>
      </div>
      <div class="problem-info"><div class="problem-num-badge">Ejercicio 2.8</div><div class="problem-visual-title">Tiempo en Bicicleta</div></div>
      <div class="formula-card">tiempo = distancia / velocidad</div>
    </div>
    <div class="problem-form-panel">
      <div class="problem-header"><h1>Tiempo de Viaje en Bicicleta</h1><p>Estima el tiempo de viaje con velocidad constante y una distancia determinada.</p></div>
      <div>
        <div class="form-group"><label class="form-label">Distancia (km)</label><input class="form-input" id="dist" type="number" placeholder="ej. 30" min="0" step="0.1"/></div>
        <div class="form-group"><label class="form-label">Velocidad (km/h)</label><input class="form-input" id="vel" type="number" placeholder="ej. 15" min="0" step="0.1"/></div>
        <div id="result" class="result-card"><div class="result-label">Tiempo de viaje</div><div class="result-value" id="result-value">—</div><div class="result-desc" id="result-desc"></div></div>
        <div style="margin-top:24px"><button class="btn-primary" onclick="calcular()"><span>✦</span> Calcular</button><button class="btn-reset" onclick="resetForm()">Limpiar campos</button></div>
      </div>
    </div>
  </div>
</main>
  <script src="../js/problema8.js"></script>
</body>
</html>
