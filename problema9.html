<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Llamada Telefonica</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="nav-brand"><div class="nav-brand-icon">🐢</div><span class="nav-brand-text">TurtleLand</span></a>
    <a href="../index.html" class="nav-back">← Inicio</a>
  </nav>
<main>
  <div class="problem-layout">
    <div class="problem-visual-panel">
      <div class="problem-emoji-wrap">
        <div class="problem-emoji-bg">
          <img src="https://png.pngtree.com/png-vector/20230815/ourmid/pngtree-cartoon-retro-kawaii-telephone-clipart-vector-png-image_6955417.png" alt="teléfono" class="problem-image">
        </div>
      </div>
      <div class="problem-info"><div class="problem-num-badge">Ejercicio 2.9</div><div class="problem-visual-title">Costo de Llamada Telefónica</div></div>
      <div class="formula-card">costo = minutos x  tarifa_por_min</div>
    </div>
    <div class="problem-form-panel">
      <div class="problem-header"><h1>Costo de Llamada Telefónica</h1><p>Calcula el costo de una llamada según su duración y la tarifa por minuto.</p></div>
      <div>
        <div class="form-group"><label class="form-label">Duración (minutos)</label><input class="form-input" id="min" type="number" placeholder="ej. 15" min="0" step="0.5"/></div>
        <div class="form-group"><label class="form-label">Costo por minuto ($)</label><input class="form-input" id="tarifa" type="number" placeholder="ej. 1.20" min="0" step="0.01"/></div>
        <div id="result" class="result-card"><div class="result-label">Costo total</div><div class="result-value" id="result-value">—</div><div class="result-desc" id="result-desc"></div></div>
        <div style="margin-top:24px"><button class="btn-primary" onclick="calcular()"><span>✦</span> Calcular</button><button class="btn-reset" onclick="resetForm()">Limpiar campos</button></div>
      </div>
    </div>
  </div>
</main>
  <script src="../js/problema9.js"></script>
</body>
</html>
